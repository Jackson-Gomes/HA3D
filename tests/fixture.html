<script type="module">
import * as THREE from "three";
import { GLTFExporter } from "/node_modules/three/examples/jsm/exporters/GLTFExporter.js";
import { GLTFLoader } from "/node_modules/three/examples/jsm/loaders/GLTFLoader.js";
import * as lighting from "/custom_components/ha3d/frontend/ha3d-lighting.js?v=20260919-3";
import * as rules from "/custom_components/ha3d/frontend/ha3d-bindings.js?v=20260919-3";
import "/custom_components/ha3d/frontend/ha3d-entry.js";
localStorage.setItem("ha3d_cinematic_enabled_v1", "0");
window.THREE = THREE;
window.lighting = lighting;
window.rules = rules;
window.makePanel = async (states = {}) => {
  const scene = new THREE.Scene();
  for (const [index, entity] of ["light.fixture", "media_player.fixture", "switch.fixture", "vacuum.fixture", "climate.fixture", "binary_sensor.fixture", "sensor.fixture"].entries()) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(.3, .3, .3), new THREE.MeshStandardMaterial());
    mesh.name = entity;
    mesh.position.set(index * .7, 0, 0);
    scene.add(mesh);
    if (index < 2) {
      for (let n = 0; n < (index === 0 ? 2 : 1); n++) {
        const node = new THREE.Group();
        node.name = `LightNode_${entity}`;
        node.position.copy(mesh.position).add(new THREE.Vector3(0, .5, n * .1));
        node.add(new THREE.PointLight(0xffffff, 10, 4));
        scene.add(node);
      }
    }
  }
  const binary = await new GLTFExporter().parseAsync(scene, { binary: true });
  const parsed = await new GLTFLoader().parseAsync(binary, "");
  window.sanitizedNames = [];
  parsed.scene.traverse(o => window.sanitizedNames.push(o.name));
  const modelUrl = URL.createObjectURL(new Blob([binary], { type: "model/gltf-binary" }));
  const panel = document.createElement("ha3d-panel");
  panel.hass = { states, user: { is_admin: false }, callApi: async () => ({ model_url: modelUrl }) };
  document.body.appendChild(panel);
  window.panel = panel;
  return modelUrl;
};
window.ready = true;
</script></body></html>
