name: Publish HA3D v0.2.10

on:
  push:
    paths:
      - '.github/workflows/release-v0.2.10.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.2.10 already exists"
          else
            gh release create v0.2.10 \
              --repo "$GITHUB_REPOSITORY" \
              --target "0774bf0c9f7a748a071bd3ccfcf70a8c6899d539" \
              --title "HA3D v0.2.10" \
              --notes "Xiaomi Map Extractor overlay test. Adds an adjustable floor map overlay with X/Z position, height, scale, rotation and opacity controls, and uses Map Extractor calibration points to map the Xiaomi H50 position into the HA3D floor." 
