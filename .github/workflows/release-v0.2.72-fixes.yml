name: Publish HA3D v0.2.72 fixes

on:
  push:
    paths:
      - .github/workflows/release-v0.2.72-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.72'

          tv=Path('custom_components/ha3d/frontend/ha3d-tv-binding-menu.js').read_text()
          assert '["center", "mdi:circle-outline", "DPAD_CENTER", "Selecionar"]' in tv
          assert '.h3tvDpad .center{grid-column:2;grid-row:2}' in tv
          assert '"OK"' not in tv

          http=Path('custom_components/ha3d/http.py').read_text()
          assert '"marker_icon"' in http

          custom=Path('custom_components/ha3d/frontend/ha3d-custom-binding-icon.js').read_text()
          assert 'config.marker_icon || config.actions?.scene_menu_icon' in custom

          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'tv-binding-menu-3' in entry
          assert 'custom-binding-icon-2' in entry
          PY
          node --check custom_components/ha3d/frontend/ha3d-tv-binding-menu.js
          node --check custom_components/ha3d/frontend/ha3d-custom-binding-icon.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js
          python -m py_compile custom_components/ha3d/http.py

      - name: Verify protected features unchanged
        run: |
          git fetch --tags --force
          for f in             custom_components/ha3d/frontend/ha3d-vacuum-binding-menu.js             custom_components/ha3d/frontend/ha3d-media-panels.js             custom_components/ha3d/frontend/ha3d-media-upload.js             custom_components/ha3d/frontend/ha3d-media-panel-power.js             custom_components/ha3d/frontend/ha3d-mjpeg.js             custom_components/ha3d/frontend/ha3d-robot-trackers.js             custom_components/ha3d/frontend/ha3d-robot-map-overlay.js             custom_components/ha3d/frontend/ha3d-robot-map-hotfix.js             custom_components/ha3d/frontend/ha3d-robot-map-shared-config.js             custom_components/ha3d/frontend/ha3d-robot-runtime-fix.js             custom_components/ha3d/frontend/ha3d-robot-motion-continuity.js             custom_components/ha3d/frontend/ha3d-robot-cleaning-pulse.js
          do
            git diff --quiet v0.2.71 -- "$f" || { echo "Protected file changed: $f"; exit 1; }
          done

      - name: Verify scope
        run: |
          ALLOWED='^(.github/workflows/release-v0.2.72-fixes.yml|custom_components/ha3d/__init__.py|custom_components/ha3d/manifest.json|custom_components/ha3d/http.py|custom_components/ha3d/frontend/ha3d-entry.js|custom_components/ha3d/frontend/ha3d-tv-binding-menu.js|custom_components/ha3d/frontend/ha3d-custom-binding-icon.js)$'
          bad="$(git diff --name-only v0.2.71 | grep -vE "$ALLOWED" || true)"
          test -z "$bad" || { echo "$bad"; exit 1; }

      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.72 -m "HA3D v0.2.72"
          git push origin v0.2.72
          gh release create v0.2.72 --title "HA3D v0.2.72" --notes "Corrige o controle da TV restaurando o botão central como uma bolinha simples sem texto. Corrige ícones customizados de bindings scene.*: marker_icon passa a ser aceito e o ícone do menu de cenas também pode servir de fallback visual. LightMedia, robô e mapa não foram alterados."
