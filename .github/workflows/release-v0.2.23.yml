name: Publish HA3D v0.2.23

on:
  push:
    paths:
      - '.github/workflows/release-v0.2.23.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.23
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.23 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v0.2.23 --repo "$GITHUB_REPOSITORY" --target "663caf0a202c85a497e72253f01a18a045f03fae" --title "HA3D v0.2.23" --notes "Adds restrained AI-like X-Ray inspection behavior: real anomalies now tint their bound 3D object red with a subtle breathing pulse, and occasional anomaly inspections gently pause the orbit, move closer to the affected object, then release the existing red callout before returning to the prior orbit. Focus events use long cooldowns, never chain, and do not run outside idle X-Ray. Adds a bottom-right Siri-blue clock/date panel plus real Home Assistant weather data when a weather.* entity exists. Callout placement reserves that status area to prevent overlap. Rollback branch: pre-anomaly-ai-focus-0.2.22."
