name: Publish HA3D v0.2.64-lightmedia.2

on:
  push:
    paths:
      - .github/workflows/release-v0.2.64-lightmedia.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify editor gizmo guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.64-lightmedia.2'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.64-lightmedia.2"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-editor-gizmo-hit-guard.js?v=editor-gizmo-hit-guard-1' in entry
          guard=Path('custom_components/ha3d/frontend/ha3d-editor-gizmo-hit-guard.js').read_text()
          for marker in ['pointerHitsGizmo', 'transformPicker', 'shouldBlockScenePick', 'oldPickObject', 'oldBeginObjectDrag']:
              assert marker in guard
          PY
          node --check custom_components/ha3d/frontend/ha3d-editor-gizmo-hit-guard.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.64-lightmedia.2 -m "HA3D v0.2.64-lightmedia.2"
          git push origin v0.2.64-lightmedia.2
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.64-lightmedia.2 \
            --title "HA3D v0.2.64-lightmedia.2" \
            --notes "Hotfix do editor sobre a v0.2.64-lightmedia.1. A tríade/TransformControls agora tem prioridade sobre a seleção da cena para qualquer geometria, luz virtual ou tela editável. Cliques e arrastos nos eixos não devem mais selecionar objetos que estejam atrás do gizmo."
