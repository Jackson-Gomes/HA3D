name: Build HA3D v0.2.15

on:
  push:
    paths:
      - '.github/workflows/run-v0.2.15-shared-map-config.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/patch_v0215.py
      - name: Validate
        run: |
          node --check custom_components/ha3d/frontend/ha3d-robot-map-shared-config.js
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
          python -m compileall -q custom_components/ha3d
      - name: Commit and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/run-v0.2.15-shared-map-config.yml tools/patch_v0215.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Persist Xiaomi map alignment across HA3D devices"
          git push origin HEAD:main
          SHA=$(git rev-parse HEAD)
          gh release create v0.2.15 --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "HA3D v0.2.15" --notes "Persist Xiaomi map alignment in Home Assistant instead of per-browser only. Existing v0.2.14 local alignment is migrated automatically; new H50 setups start with the tested alignment X 0.27715605, Z -1.0158935, height 0.24, scale 0.05, rotation -89, opacity 0.8, map hidden. All devices then share the same map configuration."
