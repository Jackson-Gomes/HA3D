name: Publish HA3D v0.2.57 top orientation fix

on:
  push:
    paths:
      - .github/workflows/release-v0.2.57.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.57'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.57"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-default-top-view.js?v=default-top-3' in entry
          top=Path('custom_components/ha3d/frontend/ha3d-default-top-view.js').read_text()
          for marker in ['TOP_AZ_DEG = 90', 'TOP_EL_DEG = 84', 'TOP_UP = [0, 1, 0]']:
              assert marker in top
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.57 -m "HA3D v0.2.57"
          git push origin v0.2.57
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.57 --title "HA3D v0.2.57" --notes "Corrige a orientação da vista Padrão/Superior sem voltar ao travamento do OrbitControls. Mantém 84 graus com Y-up para órbita livre, mas altera o azimute para 90 graus, preservando a orientação visual antiga da planta: +X à direita e -Z para cima. A restauração de bindings da v0.2.56 permanece inalterada. A v0.2.56 fica disponível como rollback."
