name: Publish HA3D v0.2.50 inspection exit

on:
  push:
    paths:
      - .github/workflows/release-v0.2.50.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.50'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.50"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-inspection-exit.js?v=inspection-exit-1' in entry
          exit_js=Path('custom_components/ha3d/frontend/ha3d-inspection-exit.js').read_text()
          for marker in ['captureReturnView', 'animateReturn', 'sameObject', 'Escape', 'EXIT_DELAY_MS']:
              assert marker in exit_js
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.50 -m "HA3D v0.2.50"
          git push origin v0.2.50
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.50 --title "HA3D v0.2.50" --notes "Adiciona saída explícita do modo de inspeção. Um clique novamente no mesmo objeto encerra a seleção, restaura materiais normais e anima a câmera de volta à posição/target anteriores. Clique em área realmente vazia também sai da inspeção e Esc funciona no desktop. Double-click continua aprofundando o zoom sem ser confundido com a saída por clique simples. A v0.2.49 permanece disponível como rollback."
