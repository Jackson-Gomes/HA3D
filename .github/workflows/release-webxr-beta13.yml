name: Publish HA3D WebXR beta 0.2.65-beta.13

on:
  push:
    branches:
      - feature/webxr
    paths:
      - .github/workflows/release-webxr-beta13.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Quest AR beta.13 wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version'] == '0.2.65-beta.13'
          init = Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.65-beta.13"' in init
          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-webxr-ar-game-controls.js?v=game-controls-1' in entry
          assert 'ha3d-webxr-ar-quest-polish.js?v=quest-polish-1' in entry

          polish = Path('custom_components/ha3d/frontend/ha3d-webxr-ar-quest-polish.js').read_text()
          for marker in [
              'XR_FRAMEBUFFER_SCALE = 0.82',
              'XR_FOVEATION = 1.0',
              'compactIconTexture',
              'openMenu',
              'menuActions',
              'runMenuAction',
              'setFramebufferScaleFactor',
              'renderer.shadowMap.enabled = false',
              '__ha3dQuestPolishV1',
          ]:
              assert marker in polish, marker
          PY
      - name: Run validation
        run: |
          node --check custom_components/ha3d/frontend/ha3d-webxr-ar-quest-polish.js
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.65-beta.13 -m "HA3D v0.2.65-beta.13 Quest AR menus and performance"
          git push origin v0.2.65-beta.13
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.65-beta.13 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "HA3D v0.2.65-beta.13 · Quest AR menus + performance" \
            --notes "Refina a beta.12 após teste real no Meta Quest. Os ícones mantêm uma área de mira confortável, mas o desenho visual fica cerca de um terço menor para não cobrir a maquete. Entidades simples continuam com ação direta; climate, media_player, vacuum, cover, lock, fan e demais entidades não-binárias passam a abrir um menu 3D dentro do WebXR, preso ao ícone e clicável pelo trigger, com ações específicas como temperatura, volume, play/pause, limpar/pausar/base, abrir/parar/fechar e lock/unlock. Para melhorar fluidez quando a casa inteira está visível, o modo XR passa a usar framebuffer a 0,82, foveation máxima quando suportada e desliga shadow maps dinâmicos apenas durante a sessão XR, restaurando tudo ao sair. Navegação por joysticks, iluminação compensada, passthrough, anchors e runtime AR v3 são preservados. main e v0.2.59 permanecem intactas."
