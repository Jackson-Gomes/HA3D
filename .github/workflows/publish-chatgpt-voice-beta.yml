name: Publish ChatGPT Voice beta

on:
  push:
    branches:
      - feature/chatgpt-voice-from-0.2.59

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-chatgpt-voice]')
    runs-on: ubuntu-latest
    steps:
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.66-beta.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HA3D v0.2.66-beta.2 · ChatGPT iframe handoff fix" \
            --notes "Corrige o handoff do ChatGPT quando o HA3D está aberto dentro de um dashboard/iframe. Em vez de tentar carregar chatgpt.com dentro do iframe, a navegação é promovida para a janela principal, evitando 'chatgpt.com se recusou a conectar'. Mantém a base v0.2.59, wake word e o handoff para ChatGPT Voice. main e v0.2.59 permanecem intactas." \
            --prerelease
