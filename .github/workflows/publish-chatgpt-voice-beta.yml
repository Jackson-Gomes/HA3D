name: Publish ChatGPT Voice beta

on:
  push:
    branches:
      - feature/chatgpt-voice-from-0.2.59

permissions:
  contents: write

jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-chatgpt-voice]')
    runs-on: ubuntu-latest
    steps:
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.66-beta.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HA3D v0.2.66-beta.3 · ChatGPT Browser Bridge" \
            --notes "Experimental ChatGPT Voice hosted inside Home Assistant: keeps the iPad microphone in HA3D, uses the HA wake-word pipeline, routes PCM through the HA3D ChatGPT Audio Bridge add-on into a PulseAudio virtual microphone, and keeps a Chromium add-on session embedded through Supervisor ingress. No iOS Shortcut or ChatGPT app handoff. Based on stable v0.2.59; main and v0.2.59 stay untouched." \
            --prerelease
