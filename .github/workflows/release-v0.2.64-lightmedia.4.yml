name: Publish HA3D v0.2.64-lightmedia.4

on:
  push:
    paths:
      - .github/workflows/release-v0.2.64-lightmedia.4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify TV-aware media panels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.64-lightmedia.4'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.64-lightmedia.4"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-media-panel-power.js?v=media-panel-power-1' in entry
          backend=Path('custom_components/ha3d/media_panels.py').read_text()
          assert 'power_entity_id' in backend
          power=Path('custom_components/ha3d/frontend/ha3d-media-panel-power.js').read_text()
          assert 'Liga/desliga com' in power
          assert 'media_player.' in power
          assert 'standby' in power
          PY
          node --check custom_components/ha3d/frontend/ha3d-media-panel-power.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.64-lightmedia.4 -m "HA3D v0.2.64-lightmedia.4"
          git push origin v0.2.64-lightmedia.4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.64-lightmedia.4 \
            --title "HA3D v0.2.64-lightmedia.4" \
            --notes "Corrige o comportamento da Tela de mídia: a fonte exibida agora é separada da entidade que controla liga/desliga. Imagem ou vídeo enviado pode ser vinculado a uma TV/media_player; playing, paused e idle mantêm a tela visível, enquanto off, standby, unavailable e unknown apagam a tela. No modo editor a tela permanece visível para permitir mover, rotacionar e redimensionar mesmo com a TV desligada."
