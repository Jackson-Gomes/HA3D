name: Publish HA3D WebXR beta 0.2.65-beta.7

on:
  push:
    branches:
      - feature/webxr
    paths:
      - .github/workflows/release-webxr-beta7.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Quest AR beta.7 wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version'] == '0.2.65-beta.7'
          init = Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.65-beta.7"' in init
          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-webxr-ar-v2.js?v=ar-v2-1' in entry
          ar = Path('custom_components/ha3d/frontend/ha3d-webxr-ar-v2.js').read_text()
          for marker in [
              'immersive-ar',
              'plane-detection',
              'hand-tracking',
              'frame?.detectedPlanes',
              'frame.createAnchor',
              'requestPersistentHandle',
              'restorePersistentAnchor',
              'initiateRoomCapture',
              'getFrame?.()',
              'HA3D_AR_ContentRoot',
          ]:
              assert marker in ar, marker
          package = json.loads(Path('package.json').read_text())
          assert 'ha3d-webxr-ar-v2.js' in package['scripts']['check']
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.65-beta.7 -m "HA3D v0.2.65-beta.7 Quest mixed reality tabletop"
          git push origin v0.2.65-beta.7
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.65-beta.7 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "HA3D v0.2.65-beta.7 · Quest mixed reality tabletop" \
            --notes "Build experimental Meta Quest em immersive-ar. Adiciona passthrough transparente, maquete unificada do apartamento e objetos dinâmicos, manipulação com um ou dois controles/mãos, detecção de planos para snap em mesa, room capture quando necessário, anchors espaciais com persistência quando suportados, guarda contra resize durante XR e cache-busting do frontend. Corrige a atualização por frame da beta anterior usando WebXRManager.getFrame() e valida sintaxe do novo runtime no CI. A v0.2.59 continua como rollback estável; main não é alterada."