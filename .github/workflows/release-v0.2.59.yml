name: Publish HA3D v0.2.59 corrected views and state balloons

on:
  push:
    paths:
      - .github/workflows/release-v0.2.59.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify corrected feature wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.59'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.59"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-floating-state-fix.js?v=floating-state-fix-1' in entry
          assert 'ha3d-bottom-view-hub.js?v=bottom-view-hub-1' in entry
          assert 'ha3d-sensor-values.js' not in entry
          assert 'ha3d-view-zones.js' not in entry
          state=Path('custom_components/ha3d/frontend/ha3d-floating-state-fix.js').read_text()
          assert 'visibility: "zoom"' in state
          assert 'ha3dFwZoomRow' in state
          views=Path('custom_components/ha3d/frontend/ha3d-bottom-view-hub.js').read_text()
          assert 'customViewsDrawerButton' in views
          assert 'LONG_PRESS_MS = 620' in views
          assert 'quick_access' in views
          assert 'ha3dViewZoneId' in views
          assert 'Criar retângulo' in views
          assert '#viewsPanel #saveViewButton' in views
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.59 -m "HA3D v0.2.59"
          git push origin v0.2.59
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.59 --title "HA3D v0.2.59" --notes "Corrige a interpretação da v0.2.58. A engrenagem/configuração não é usada para o novo fluxo de vistas. O botão de Vistas da barra inferior passa a ter toque curto para a vista marcada como acesso rápido (ou Padrão quando nenhuma estiver marcada) e long-press para abrir o menu completo. A criação de vistas fica nesse menu inferior; o atalho de criação do painel superior/configuração é ocultado. O lápis da vista permite criar/redesenhar uma zona retangular no piso, ajustar altura, X/Z, largura/profundidade e mostrar/ocultar; a zona continua clicável quando visualmente oculta e leva à vista vinculada. Para sensores/estados, remove os rótulos adicionados ao ícone na v0.2.58 e usa o sistema nativo de balões + Estado. Novos balões Estado usam Quando aproximar por padrão com o slider Distância para aparecer; balões Estado antigos em Quando clicar são migrados para proximidade, pois o click simples de geometria foi removido. A v0.2.57 permanece como rollback estável."
