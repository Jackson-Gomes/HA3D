name: Publish HA3D v0.2.64-lightmedia.5-beta.2

on:
  push:
    paths:
      - .github/workflows/release-v0.2.64-lightmedia.5-beta.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify light marker quick control beta 2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version='0.2.64-lightmedia.5-beta.2'
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']==version
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert f'FRONTEND_VERSION = "{version}"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-light-marker-quick-control.js?v=light-marker-quick-control-2' in entry
          quick=Path('custom_components/ha3d/frontend/ha3d-light-marker-quick-control.js').read_text()
          for marker in [
              'cloneNode(true)',
              'original.replaceWith(marker)',
              'binding.marker = marker',
              'callService("light", "toggle"',
              '_openNativeMoreInfo?.(entityId)',
              'HOLD_MS = 550',
              'pointerup',
              'stopImmediatePropagation()',
          ]:
              assert marker in quick
          PY
          node --check custom_components/ha3d/frontend/ha3d-light-marker-quick-control.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.64-lightmedia.5-beta.2 -m "HA3D v0.2.64-lightmedia.5-beta.2"
          git push origin v0.2.64-lightmedia.5-beta.2
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.64-lightmedia.5-beta.2 \
            --prerelease \
            --title "HA3D v0.2.64-lightmedia.5-beta.2" \
            --notes "Corrige o beta anterior. O marcador light.* é clonado para remover completamente o listener legado que abria more-info no clique curto. Toque curto agora executa somente light.toggle no pointerup; pressionar por ~550 ms abre o more-info nativo. A estável v0.2.64-lightmedia.4 permanece preservada."
