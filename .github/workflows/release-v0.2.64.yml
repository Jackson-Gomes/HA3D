name: Publish HA3D v0.2.64 no-empty-overlay fail-safe

on:
  push:
    paths:
      - .github/workflows/release-v0.2.64.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify no-empty-overlay fail-safe
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.64'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.64"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-no-empty-overlay.js?v=no-empty-overlay-1' in entry
          guard=Path('custom_components/ha3d/frontend/ha3d-no-empty-overlay.js').read_text()
          for marker in ['#empty{display:none!important}', 'modelIsRenderable', 'auxiliary module failed after model load; scene preserved', 'proto._showEmpty = function']:
              assert marker in guard
          PY
          node --check custom_components/ha3d/frontend/ha3d-no-empty-overlay.js
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.64 -m "HA3D v0.2.64"
          git push origin v0.2.64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.64 --title "HA3D v0.2.64" --notes "Remove da interface o cartão antigo 'Seu Home Assistant em 3D / Escolher GLB' e adiciona um fail-safe carregado por último: se o GLB já estiver renderizado, falhas de módulos auxiliares não podem mais fazer o dashboard voltar visualmente ao estado de sem modelo. O upload continua disponível pelo botão Subir GLB; sem GLB configurado, o painel usa apenas o status discreto. Mantém o destaque do robô da v0.2.63: ciano durante cleaning normal e vermelho pulsante durante X-Ray cinematográfico."
