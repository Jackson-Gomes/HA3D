name: Publish HA3D v0.2.64-lightmedia.5-beta.3

on:
  push:
    paths:
      - .github/workflows/release-v0.2.64-lightmedia.5-beta.3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify black TV screen behavior
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version='0.2.64-lightmedia.5-beta.3'
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']==version
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert f'FRONTEND_VERSION = "{version}"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-media-panel-power.js?v=media-panel-power-2' in entry
          power=Path('custom_components/ha3d/frontend/ha3d-media-panel-power.js').read_text()
          for marker in [
              'function syncScreenBlackout(runtime, powered)',
              'powered ? 0xffffff : 0x000000',
              'runtime.group.visible = runtime.config.enabled !== false;',
              'video.pause?.()',
              '__ha3dMediaPanelPowerV3',
          ]:
              assert marker in power
          PY
          node --check custom_components/ha3d/frontend/ha3d-media-panel-power.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.64-lightmedia.5-beta.3 -m "HA3D v0.2.64-lightmedia.5-beta.3"
          git push origin v0.2.64-lightmedia.5-beta.3
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.64-lightmedia.5-beta.3 \
            --prerelease \
            --title "HA3D v0.2.64-lightmedia.5-beta.3" \
            --notes "Corrige a Tela de mídia vinculada à TV: quando a entidade de energia está off/standby/unavailable/unknown, a tela permanece fisicamente visível porém preta, como uma TV desligada. O vídeo é pausado em segundo plano para economizar recursos e retoma quando a TV volta a ficar ativa. Mantém também o teste de clique curto/long-press das lâmpadas. A estável v0.2.64-lightmedia.4 permanece preservada."
