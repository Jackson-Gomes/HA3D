name: Publish HA3D v0.2.64-lightmedia.5-beta.4

on:
  push:
    paths:
      - .github/workflows/release-v0.2.64-lightmedia.5-beta.4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify delegated light quick control
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version='0.2.64-lightmedia.5-beta.4'
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']==version
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert f'FRONTEND_VERSION = "{version}"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-light-marker-quick-control.js?v=light-marker-quick-control-3' in entry
          quick=Path('custom_components/ha3d/frontend/ha3d-light-marker-quick-control.js').read_text()
          for marker in [
              '__ha3dLightQuickControlV3',
              'root.addEventListener("pointerdown"',
              'root.addEventListener("pointerup"',
              'root.addEventListener("click"',
              'event.stopImmediatePropagation()',
              'callService("light", "toggle"',
              '_openNativeMoreInfo?.(activeBinding.entity)',
          ]:
              assert marker in quick
          power=Path('custom_components/ha3d/frontend/ha3d-media-panel-power.js').read_text()
          assert 'powered ? 0xffffff : 0x000000' in power
          PY
          node --check custom_components/ha3d/frontend/ha3d-light-marker-quick-control.js
          node --check custom_components/ha3d/frontend/ha3d-media-panel-power.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.64-lightmedia.5-beta.4 -m "HA3D v0.2.64-lightmedia.5-beta.4"
          git push origin v0.2.64-lightmedia.5-beta.4
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.64-lightmedia.5-beta.4 \
            --prerelease \
            --title "HA3D v0.2.64-lightmedia.5-beta.4" \
            --notes "Corrige definitivamente o clique curto nos ícones light.*: o shadowRoot intercepta pointer/click em fase de captura antes de qualquer listener legado. Toque curto executa somente light.toggle; segurar ~550 ms abre o more-info. Mantém a Tela de mídia preta quando a TV está desligada. A estável v0.2.64-lightmedia.4 permanece preservada."
