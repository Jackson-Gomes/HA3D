name: Publish HA3D v0.2.39 gizmo selection fix

on:
  push:
    paths:
      - .github/workflows/release-v0.2.39.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.39'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.39"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'editor-gizmo-persistence-2' in entry
          fix=Path('custom_components/ha3d/frontend/ha3d-editor-gizmo-persistence-fix.js').read_text()
          assert 'GIZMO_SIZE = 1.25' in fix
          assert 'controls?.axis' not in fix.split('function gizmoOwnsPointer',1)[1].split('if (!proto.',1)[0]
          assert 'rotation: [object.rotation.x, object.rotation.y, object.rotation.z]' in fix
          PY
      - name: Run validation
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.39 -m "HA3D v0.2.39"
          git push origin v0.2.39
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.39 --title "HA3D v0.2.39" --notes "Corrige a regressão de seleção introduzida na v0.2.38. O hover do gizmo não bloqueia mais o raycast do modelo, permitindo selecionar cadeiras e outros objetos pequenos normalmente. O gizmo permanece maior que o original, agora em 1.25x, e a correção de persistência da v0.2.38 foi preservada."
