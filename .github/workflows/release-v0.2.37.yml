name: Publish HA3D v0.2.37 visual pivot editor

on:
  push:
    paths:
      - .github/workflows/release-v0.2.37.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.37'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.37"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'editor-object-root-2' in entry
          editor=Path('custom_components/ha3d/frontend/ha3d-editor-object-root.js').read_text()
          for marker in ['HA3D_EditorVisualPivot','visualCenter','applyProxyDelta','__ha3dEditorLogicalRootV2']:
              assert marker in editor
          PY
      - name: Run validation
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.37 -m "HA3D v0.2.37"
          git push origin v0.2.37
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.37 --title "HA3D v0.2.37" --notes "Corrige o editor 3D para ignorar pivots importados ruins. O gizmo agora usa um pivot virtual no centro visual real do bounding box da geometria e aplica mover/rotacionar/escalar por delta de matriz ao objeto lógico completo. O arraste livre também usa o centro visual e movimenta o conjunto sem depender da origem do GLB. Inclui cache bust completo do frontend para garantir que a correção seja carregada."
