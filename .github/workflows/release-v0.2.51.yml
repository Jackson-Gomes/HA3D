name: Publish HA3D v0.2.51 smart picker

on:
  push:
    paths:
      - .github/workflows/release-v0.2.51.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.51'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.51"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-smart-picker.js?v=smart-picker-1' in entry
          picker=Path('custom_components/ha3d/frontend/ha3d-smart-picker.js').read_text()
          for marker in ['firstNeedsHelp', 'depthWindow', 'isArchitectureCandidate', 'isSpecialHelper', 'ha3dVirtualLightId']:
              assert marker in picker
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.51 -m "HA3D v0.2.51"
          git push origin v0.2.51
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.51 --title "HA3D v0.2.51" --notes "Melhora a seleção de geometria com um smart picker conservador. O HA3D continua escolhendo o primeiro hit quando ele é um objeto normal; quando o primeiro hit parece arquitetura grande (parede, piso, teto, vidro/janela) ou material transparente, avalia apenas candidatos próximos em profundidade e favorece a raiz lógica menor/mais específica. Isso reduz cliques em bordas de parede quando a intenção é selecionar móveis próximos, sem permitir seleção através de paredes distantes. Helpers do Editor, incluindo luzes virtuais e widgets, continuam com prioridade. A v0.2.50 permanece disponível como rollback."
