name: Publish HA3D v0.2.62 robot geometry pulse and motion continuity

on:
  push:
    paths:
      - .github/workflows/release-v0.2.62.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify robot visual fixes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.62'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.62"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-robot-motion-continuity.js?v=robot-motion-continuity-1' in entry
          assert 'ha3d-robot-cleaning-pulse.js?v=robot-cleaning-pulse-2' in entry
          pulse=Path('custom_components/ha3d/frontend/ha3d-robot-cleaning-pulse.js').read_text()
          for marker in ['makeGeometryGhost', 'source.clone(true)', 'depthTest: false', 'RingGeometry']:
              assert marker in pulse
          motion=Path('custom_components/ha3d/frontend/ha3d-robot-motion-continuity.js').read_text()
          for marker in ['intervalMs', 'velocity', 'horizonMs', 'atualização ~']:
              assert marker in motion
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.62 -m "HA3D v0.2.62"
          git push origin v0.2.62
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.62 --title "HA3D v0.2.62" --notes "Corrige o efeito de limpeza para usar a geometria real do robô quando a representação está configurada como Objeto do GLB: a própria malha recebe uma cópia visual X-Ray ciano visível através de paredes/móveis, mantendo os anéis pulsantes e beacon; o cilindro genérico fica apenas como fallback. Também adiciona continuidade de movimento enquanto cleaning: mede a cadência real do sensor vacuum_position, acelera a convergência em relação ao smoothing padrão de 1600 ms e usa previsão curta baseada nas duas últimas amostras para reduzir o efeito anda-para-anda sem extrapolar indefinidamente. O painel do robô passa a mostrar a cadência observada de atualização. Não altera calibração nem Map Extractor."
