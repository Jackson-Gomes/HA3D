name: SKP smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install OpenSKP
        run: python -m pip install 'openskp==1.3.0'
      - name: Convert generated SKP to GLB
        run: |
          python - <<'PY'
          from pathlib import Path
          from openskp import create, SkpFile
          from openskp.export import glb

          source = Path('/tmp/ha3d-smoke.skp')
          target = Path('/tmp/ha3d-smoke.glb')

          builder = create()
          builder.add_face([(0, 0, 0), (100, 0, 0), (100, 100, 0), (0, 100, 0)])
          builder.save(source)

          skp = SkpFile.open(source)
          glb.export(skp, target)

          assert target.read_bytes()[:4] == b'glTF'
          assert target.stat().st_size > 20
          print(f'OK: {source.stat().st_size} -> {target.stat().st_size} bytes')
          PY
