name: Publish HA3D WebXR beta 0.2.65-beta.9

on:
  push:
    branches:
      - feature/webxr
    paths:
      - .github/workflows/release-webxr-beta9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Quest AR beta.9 wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version'] == '0.2.65-beta.9'
          init = Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.65-beta.9"' in init
          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-webxr-ar-v3.js?v=ar-v3-1' in entry
          assert 'ha3d-webxr-ar-tabletop-fix.js?v=tabletop-fix-1' in entry

          ar = Path('custom_components/ha3d/frontend/ha3d-webxr-ar-v3.js').read_text()
          for marker in [
              'immersive-ar',
              'plane-detection',
              'hand-tracking',
              'getFrame?.()',
              'session.enabledFeatures',
              'requestPersistentHandle',
              'restorePersistentAnchor',
              'deletePersistentAnchor',
              'initiateRoomCapture',
              'planeCenterWorld',
              'modelKey',
              '_ha3dAR3Starting',
              'restoreSessionState',
              'hapticActuators',
          ]:
              assert marker in ar, marker

          fix = Path('custom_components/ha3d/frontend/ha3d-webxr-ar-tabletop-fix.js').read_text()
          for marker in [
              'robustModelBounds',
              'collectMeshBounds',
              'TARGET_WIDTH_METERS = 1.0',
              'TABLETOP_BOTTOM_METERS = 0.75',
              'DISTANCE_METERS = 1.25',
              '_ha3dAR3Anchor',
              '_ha3dAR3ManualMoved',
              '_ha3dAR3TableSnapped',
              '__ha3dARTabletopBoundsFix',
          ]:
              assert marker in fix, marker

          package = json.loads(Path('package.json').read_text())
          assert 'ha3d-webxr-ar-v3.js' in package['scripts']['check']
          assert 'ha3d-webxr-ar-tabletop-fix.js' in package['scripts']['check']
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.65-beta.9 -m "HA3D v0.2.65-beta.9 Quest AR tabletop bounds fix"
          git push origin v0.2.65-beta.9
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.65-beta.9 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "HA3D v0.2.65-beta.9 · Quest AR tabletop bounds fix" \
            --notes "Corrige o caso em que a maquete em immersive-ar aparecia como um ponto branco minúsculo e distante. Mantém intacto o runtime AR v3 da beta.8 — passthrough, detecção de planos, snap em mesa, room capture, anchors persistentes, manipulação com uma ou duas mãos/controles e feedback háptico — e adiciona um ajuste isolado de enquadramento que calcula limites robustos somente a partir das meshes renderizáveis, rejeitando objetos exportados isolados que distorcem o bounding box. A maquete passa a abrir com aproximadamente 1 m de largura, base a 0,75 m e cerca de 1,25 m à frente, sem sobrescrever posição persistida, snap de mesa ou movimento manual. main e a v0.2.59 permanecem intactas."
