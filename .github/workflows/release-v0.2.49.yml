name: Publish HA3D v0.2.49 robot runtime fix

on:
  push:
    paths:
      - .github/workflows/release-v0.2.49.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.49'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.49"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-robot-runtime-fix.js?v=robot-runtime-fix-1' in entry
          fix=Path('custom_components/ha3d/frontend/ha3d-robot-runtime-fix.js').read_text()
          for marker in ['enforceConfiguredRobotHeight', 'preserveLoadedMapOnTemporaryOutage', 'floor_y', 'ha3d_xiaomi_map_overlay_v1']:
              assert marker in fix
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.49 -m "HA3D v0.2.49"
          git push origin v0.2.49
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.49 --title "HA3D v0.2.49" --notes "Corrige regressões de runtime do robô sem alterar calibração ou rastreamento. A altura configurada do robô (floor_y) volta a ser independente da altura do overlay do mapa, evitando que um hotfix antigo a sobrescreva a cada update. Se o Map Extractor ficar temporariamente unavailable após uma textura já ter sido carregada, o HA3D preserva a última imagem do mapa quando Mostrar mapa estiver ativo. Se a página abrir sem entity_picture disponível, o mapa volta normalmente quando a entidade recuperar. A v0.2.48 permanece disponível como rollback."
