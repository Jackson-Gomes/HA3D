name: Publish HA3D v0.2.27

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate manifest version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version=json.loads(Path('custom_components/ha3d/manifest.json').read_text())['version']
          if version != '0.2.27': raise SystemExit(f'Expected 0.2.27, got {version}')
          PY
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.27 -m "HA3D v0.2.27"
          git push origin v0.2.27
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.27 --title "HA3D v0.2.27" --notes "Restores X-Ray scanner/organic telemetry activation and gives an actively cleaning vacuum priority in autonomous exploration. While cleaning, robot-focused inspections occur more frequently and can coexist with its live telemetry messages."
