name: Publish HA3D v0.2.33 dynamic robot Scanner targeting

on:
  push:
    paths:
      - .github/workflows/hotfix-v0.2.33.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Scanner robot targeting and telemetry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ai = Path('custom_components/ha3d/frontend/ha3d-ai-autonomous-exploration.js')
          a = ai.read_text(encoding='utf-8')
          a = a.replace('const ROBOT_FOCUS_CHANCE = 0.68;', 'const ROBOT_FOCUS_CHANCE = 0.32;', 1)

          anchor = '''function candidateObjects(panel) {\n'''
          helper = '''function trackedRobotTarget(panel, entity) {\n  if (!String(entity || "").startsWith("vacuum.")) return null;\n  const entries = panel?._robotEntries;\n  if (!(entries instanceof Map)) return null;\n  for (const entry of entries.values()) {\n    if (entry?.config?.vacuum_entity !== entity) continue;\n    const root = entry.object || entry.icon;\n    if (root?.isObject3D && root.visible !== false) return root;\n  }\n  return null;\n}\n\n'''
          if helper not in a:
              if anchor not in a:
                  raise SystemExit('candidateObjects anchor not found')
              a = a.replace(anchor, helper + anchor, 1)

          old_object = '    const object = objects.find((item) => item?.isObject3D && item.visible !== false);'
          new_object = '    const object = trackedRobotTarget(panel, entity) || objects.find((item) => item?.isObject3D && item.visible !== false);'
          if old_object not in a:
              raise SystemExit('candidate target line not found')
          a = a.replace(old_object, new_object, 1)

          old_robot = '  if (robotCandidate && Math.random() < ROBOT_FOCUS_CHANCE) return robotCandidate;'
          new_robot = '  if (robotCandidate && st.lastEntity !== robot && Math.random() < ROBOT_FOCUS_CHANCE) return robotCandidate;'
          if old_robot not in a:
              raise SystemExit('robot priority line not found')
          a = a.replace(old_robot, new_robot, 1)

          old_anomaly = '    const anomalyCandidates = candidates.filter((item) => anomalies.has(item.entity));'
          new_anomaly = '    const anomalyCandidates = candidates.filter((item) => anomalies.has(item.entity) && item.entity !== st.lastEntity);'
          if old_anomaly not in a:
              raise SystemExit('anomaly candidate line not found')
          a = a.replace(old_anomaly, new_anomaly, 1)
          ai.write_text(a, encoding='utf-8')

          hud = Path('custom_components/ha3d/frontend/ha3d-live-telemetry-hud.js')
          h = hud.read_text(encoding='utf-8')

          detail_anchor = 'function detailRows(entity, state) {\n'
          robot_helpers = '''function trackedRobotEntry(panel, entity) {\n  if (!String(entity || "").startsWith("vacuum.")) return null;\n  const entries = panel?._robotEntries;\n  if (!(entries instanceof Map)) return null;\n  for (const entry of entries.values()) {\n    if (entry?.config?.vacuum_entity === entity) return entry;\n  }\n  return null;\n}\n\nfunction trackedTargetObject(panel, entity) {\n  const entry = trackedRobotEntry(panel, entity);\n  const tracked = entry?.object || entry?.icon;\n  if (tracked?.isObject3D && tracked.visible !== false) return tracked;\n  const raw = panel._objectsByEntity?.get?.(entity);\n  const objects = Array.isArray(raw) ? raw : (raw instanceof Set ? [...raw] : [raw]);\n  return objects.find((item) => item?.isObject3D && item.visible !== false) || null;\n}\n\nfunction firstUseful(...values) {\n  return values.find((value) => value !== undefined && value !== null && value !== "") ?? null;\n}\n\nfunction robotPositionSource(panel, entry) {\n  const state = panel?._hass?.states?.[entry?.config?.position_entity];\n  if (!state) return {};\n  let source = { ...(state.attributes || {}) };\n  if (![source.x, source.y, source.a].some((value) => value !== undefined)) {\n    try { source = { ...source, ...JSON.parse(state.state) }; } catch (_error) {}\n  }\n  const embedded = source.vacuum_position || source.position;\n  if (embedded && typeof embedded === "object") source = { ...source, ...embedded };\n  return source;\n}\n\nfunction robotDetailRows(panel, entity, state) {\n  const entry = trackedRobotEntry(panel, entity);\n  if (!entry) return null;\n  const attrs = state?.attributes || {};\n  const pos = robotPositionSource(panel, entry);\n  const rows = [["STATE", displayState(entity, state)]];\n  const battery = firstUseful(attrs.battery_level, attrs.battery);\n  if (battery != null) rows.push(["BATTERY", valueWithUnit(battery, "%")]);\n  const room = firstUseful(attrs.current_room, attrs.room_name, attrs.room, attrs.segment_name, attrs.segment, pos.current_room, pos.room_name, pos.room, pos.segment_name, pos.segment);\n  if (room != null) rows.push(["ROOM", String(room)]);\n  const speed = firstUseful(attrs.current_speed, attrs.movement_speed, attrs.speed, pos.current_speed, pos.movement_speed, pos.speed);\n  if (speed != null) rows.push(["SPEED", String(speed)]);\n  const heading = firstUseful(pos.a, pos.heading, pos.angle);\n  if (heading != null) rows.push(["HEADING", `${formatScalar(scalar(heading) ?? heading)}°`]);\n  const x = scalar(pos.x), y = scalar(pos.y);\n  if (x != null && y != null) rows.push(["MAP POS", `${formatScalar(x)}, ${formatScalar(y)}`]);\n  rows.push(["UPDATED", stateAge(state)]);\n  return rows.slice(0, 7);\n}\n\n'''
          if robot_helpers not in h:
              if detail_anchor not in h:
                  raise SystemExit('detailRows anchor not found')
              h = h.replace(detail_anchor, robot_helpers + detail_anchor, 1)

          old_detail = 'function detailRows(entity, state) {\n  const attrs = state?.attributes || {};'
          new_detail = 'function detailRows(entity, state, panel = null) {\n  const robotRows = panel ? robotDetailRows(panel, entity, state) : null;\n  if (robotRows) return robotRows;\n  const attrs = state?.attributes || {};'
          if old_detail not in h:
              raise SystemExit('detailRows signature not found')
          h = h.replace(old_detail, new_detail, 1)

          old_show = 'async function showCallout(panel,entity,reason=null){if(!isXrayActive(panel))return;const state=panel._hass?.states?.[entity],object=panel._objectsByEntity?.get?.(entity)?.[0];if(!state||!object)return;'
          new_show = 'async function showCallout(panel,entity,reason=null){if(!isXrayActive(panel))return;const state=panel._hass?.states?.[entity],object=trackedTargetObject(panel,entity);if(!state||!object)return;'
          if old_show not in h:
              raise SystemExit('showCallout target lookup not found')
          h = h.replace(old_show, new_show, 1)

          old_rows = 'for(const [label,value] of detailRows(entity,state))'
          new_rows = 'for(const [label,value] of detailRows(entity,state,panel))'
          if old_rows not in h:
              raise SystemExit('detailRows call not found')
          h = h.replace(old_rows, new_rows, 1)
          hud.write_text(h, encoding='utf-8')

          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js')
          e = entry.read_text(encoding='utf-8')
          pairs = [
              ('ha3d-live-telemetry-hud.js?v=live-telemetry-3', 'ha3d-live-telemetry-hud.js?v=live-telemetry-4'),
              ('ha3d-ai-autonomous-exploration.js?v=ai-autonomous-exploration-6', 'ha3d-ai-autonomous-exploration.js?v=ai-autonomous-exploration-7'),
          ]
          for old, new in pairs:
              if old not in e:
                  raise SystemExit(f'entry token not found: {old}')
              e = e.replace(old, new, 1)
          entry.write_text(e, encoding='utf-8')

          manifest = Path('custom_components/ha3d/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          if data.get('version') != '0.2.32':
              raise SystemExit(f"Expected 0.2.32, got {data.get('version')}")
          data['version'] = '0.2.33'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate frontend syntax
        run: |
          node --check custom_components/ha3d/frontend/ha3d-ai-autonomous-exploration.js
          node --check custom_components/ha3d/frontend/ha3d-live-telemetry-hud.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js

      - name: Run project validation
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha3d/frontend/ha3d-ai-autonomous-exploration.js custom_components/ha3d/frontend/ha3d-live-telemetry-hud.js custom_components/ha3d/frontend/ha3d-entry.js custom_components/ha3d/manifest.json
          git commit -m "Use live robot tracker target in Scanner"
          git push origin HEAD:main

      - name: Tag v0.2.33
        run: |
          git tag -a v0.2.33 -m "HA3D v0.2.33"
          git push origin v0.2.33

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.33 --title "HA3D v0.2.33" --notes "Scanner now targets the robot's live tracker object/icon instead of the static GLB vacuum geometry whenever a tracked vacuum is available. Robot preference is reduced and the same vacuum cannot be selected twice in a row by the priority path. Robot Scanner cards use live vacuum plus tracker telemetry and show available state, battery, room/segment, speed, heading, map position and update age without inventing missing values. Keeps X-Ray, Scanner focus highlight, anomaly arbitration and existing tracking behavior unchanged."
