name: Publish HA3D v0.3.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.3.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.1 already published"
            exit 0
          fi
          gh release create v0.3.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HA3D v0.3.1" \
            --notes "Corrige o editor 3D para manter a luz virtual selecionada durante o arraste, evitando que o raycast caia na geometria atrás. Amplia a área de captura da luz selecionada e bloqueia o clique residual após soltar o mouse. Mantém todas as mudanças da v0.3.0."
