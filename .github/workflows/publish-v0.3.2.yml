name: Publish HA3D v0.3.2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.3.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.2 already published"
            exit 0
          fi
          gh release create v0.3.2 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HA3D v0.3.2" \
            --notes "Adiciona importação direta de arquivos SketchUp .skp no HA3D, com conversão local para GLB via OpenSKP 1.3.0. Também reforça o bloqueio da seleção do editor e do gizmo para impedir que a geometria atrás roube a seleção, inclusive quando uma luz virtual é escolhida pelo menu."
