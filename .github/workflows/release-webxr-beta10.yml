name: Publish HA3D WebXR beta 0.2.65-beta.10

on:
  push:
    branches:
      - feature/webxr
    paths:
      - .github/workflows/release-webxr-beta10.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Quest AR beta.10 wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version'] == '0.2.65-beta.10'
          init = Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.65-beta.10"' in init
          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-webxr-ar-v3.js?v=ar-v3-1' in entry
          assert 'ha3d-webxr-ar-tabletop-fix.js?v=tabletop-fix-2' in entry

          ar = Path('custom_components/ha3d/frontend/ha3d-webxr-ar-v3.js').read_text()
          for marker in [
              'immersive-ar',
              'plane-detection',
              'hand-tracking',
              'requestPersistentHandle',
              'restorePersistentAnchor',
              'hapticActuators',
          ]:
              assert marker in ar, marker

          fix = Path('custom_components/ha3d/frontend/ha3d-webxr-ar-tabletop-fix.js').read_text()
          for marker in [
              'robustModelBounds',
              'TARGET_WIDTH_METERS = 1.0',
              'DISTANCE_FROM_VIEWER_METERS = 1.0',
              'CENTER_BELOW_EYES_METERS = 0.25',
              'getViewerPose',
              'placeInFrontOfViewer',
              'installGrabOverride',
              'grabStart',
              'grabEnd',
              'beta10_anchor_migrated',
              '__ha3dARTabletopViewerFixV2',
          ]:
              assert marker in fix, marker

          package = json.loads(Path('package.json').read_text())
          assert 'ha3d-webxr-ar-v3.js' in package['scripts']['check']
          assert 'ha3d-webxr-ar-tabletop-fix.js' in package['scripts']['check']
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.65-beta.10 -m "HA3D v0.2.65-beta.10 Quest AR viewer placement and controls"
          git push origin v0.2.65-beta.10
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.65-beta.10 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "HA3D v0.2.65-beta.10 · Quest AR viewer placement + controls" \
            --notes "Corrige a posição inicial da maquete usando a pose real do visor no Meta Quest, em vez da origem local-floor da sala: a maquete abre centralizada aproximadamente 1 m à frente e 25 cm abaixo da linha dos olhos. Também corrige a manipulação com controles/mãos: o gatilho/pinch passa a agarrar a maquete inteira sem exigir que o raycast acerte uma mesh, mantendo arraste com uma mão e escala/rotação com duas. A primeira execução da beta.10 invalida uma vez o anchor antigo para não restaurar a posição deslocada das betas anteriores. O runtime AR v3, passthrough, anchors e demais recursos continuam preservados. main e v0.2.59 seguem intactas."
