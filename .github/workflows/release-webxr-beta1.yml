name: Publish HA3D WebXR beta 0.2.65-beta.1

on:
  push:
    branches:
      - feature/webxr
    paths:
      - .github/workflows/release-webxr-beta1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify WebXR beta wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version'] == '0.2.65-beta.1'
          init = Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.65-beta.1"' in init
          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-webxr.js?v=webxr-1' in entry
          xr = Path('custom_components/ha3d/frontend/ha3d-webxr.js').read_text()
          assert 'immersive-vr' in xr
          assert 'local-floor' in xr
          assert 'navigator.xr.requestSession' in xr
          assert 'this._renderer.xr.enabled = true' in xr
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.65-beta.1 -m "HA3D v0.2.65-beta.1 WebXR"
          git push origin v0.2.65-beta.1
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.65-beta.1 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "HA3D v0.2.65-beta.1 · Meta Quest WebXR" \
            --notes "Primeiro build experimental do HA3D para Meta Quest, baseado diretamente na v0.2.59 estável. Adiciona detecção de WebXR immersive-vr, botão Entrar no VR somente em dispositivos compatíveis, referência local-floor, suporte opcional a hand-tracking, framebuffer reduzido e foveation para desempenho no Quest, isolamento da UI 2D durante a sessão e restauração da câmera/controles ao sair. OrbitControls, Cinematic e X-Ray idle ficam suspensos durante o VR para não competir com o rastreamento de cabeça. Requer contexto HTTPS para WebXR. Este é um prerelease de teste; v0.2.59 permanece como rollback estável."
