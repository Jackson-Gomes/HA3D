name: Publish HA3D v0.2.43 virtual light polish

on:
  push:
    paths:
      - .github/workflows/release-v0.2.43.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.43'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.43"' in init
          validator=Path('custom_components/ha3d/virtual_lights.py').read_text()
          assert '"show_marker"' in validator and '"tv_flicker"' in validator
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          for marker in ['virtual-light-options-1','virtual-light-markers-2','virtual-light-effects-1','virtual-light-cinematic-2']:
              assert marker in entry
          markers=Path('custom_components/ha3d/frontend/ha3d-virtual-light-markers.js').read_text()
          assert '_openNativeMoreInfo' in markers and 'show_marker' in markers
          cinematic=Path('custom_components/ha3d/frontend/ha3d-virtual-light-cinematic.js').read_text()
          assert 'visibleVirtualIdsForEntity' in cinematic and 'show_marker !== false' in cinematic
          effects=Path('custom_components/ha3d/frontend/ha3d-virtual-light-effects.js').read_text()
          assert 'tv_flicker' in effects and 'colorWave' in effects and 'flicker' in effects
          options=Path('custom_components/ha3d/frontend/ha3d-virtual-light-options.js').read_text()
          assert 'Mostrar ícone' in options and 'Cintilação tipo TV' in options
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.43 -m "HA3D v0.2.43"
          git push origin v0.2.43
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.43 --title "HA3D v0.2.43" --notes "Refina as luzes virtuais sem alterar a base estável. Marcadores vinculados a entidades agora abrem o more-info nativo do Home Assistant como os demais dispositivos. Cada luz virtual ganha a opção Mostrar ícone; quando várias luzes usam a mesma entidade, o modo cinematográfico foca somente as que mantêm o ícone visível, enquadrando uma ou várias conforme configurado. Spots também ganham o efeito opcional Cintilação tipo TV, reutilizando a mesma variação orgânica azul/roxo e de intensidade já usada na iluminação da TV. A v0.2.42 permanece disponível como rollback."
