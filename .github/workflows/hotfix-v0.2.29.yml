name: Publish HA3D v0.2.29 X-Ray Scanner chain fix

on:
  push:
    paths:
      - .github/workflows/hotfix-v0.2.29.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Cinematic to X-Ray to Scanner chain
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          xray = Path('custom_components/ha3d/frontend/ha3d-xray-idle-v4.js')
          text = xray.read_text(encoding='utf-8')

          old_gate = '    panel?.isConnected &&\n      panel._model &&'
          new_gate = '    panel?.isConnected &&\n      panel._cinematicEnabled &&\n      panel._model &&'
          if old_gate in text:
              text = text.replace(old_gate, new_gate, 1)
          elif new_gate not in text:
              raise SystemExit('Could not locate X-Ray Cinematic gate')

          enter_marker = '  panel.shadowRoot?.querySelector("#root")?.classList.add("ha3d-idle-xray");\n\n  applyXray(panel, true);'
          enter_replacement = '  panel.shadowRoot?.querySelector("#root")?.classList.add("ha3d-idle-xray");\n  queueMicrotask(() => panel._ha3dScannerSync?.());\n\n  applyXray(panel, true);'
          if enter_marker in text:
              text = text.replace(enter_marker, enter_replacement, 1)
          elif 'queueMicrotask(() => panel._ha3dScannerSync?.());' not in text:
              raise SystemExit('Could not wire Scanner activation on X-Ray entry')

          stop_marker = '  panel._ha3dIdleActive = false;\n  panel.shadowRoot?.querySelector("#root")?.classList.remove("ha3d-idle-xray");\n  applyXray(panel, false);'
          stop_replacement = '  panel._ha3dIdleActive = false;\n  panel.shadowRoot?.querySelector("#root")?.classList.remove("ha3d-idle-xray");\n  queueMicrotask(() => panel._ha3dScannerSync?.());\n  applyXray(panel, false);'
          if stop_marker in text:
              text = text.replace(stop_marker, stop_replacement, 1)

          xray.write_text(text, encoding='utf-8')

          hud = Path('custom_components/ha3d/frontend/ha3d-live-telemetry-hud.js')
          h = hud.read_text(encoding='utf-8')
          old_active = 'function isXrayActive(panel) {\n  return Boolean(panel?.shadowRoot?.querySelector("#root")?.classList.contains("ha3d-idle-xray"));\n}'
          new_active = 'function isXrayActive(panel) {\n  const controllerActive = panel?._ha3dIdleActive === true;\n  const visualActive = panel?.shadowRoot?.querySelector("#root")?.classList.contains("ha3d-idle-xray") === true;\n  return Boolean(controllerActive || visualActive);\n}'
          if old_active in h:
              h = h.replace(old_active, new_active, 1)
          elif new_active not in h:
              raise SystemExit('Could not harden Scanner X-Ray detection')

          old_install = 'function install(panel){if(!panel?.shadowRoot)return;ensureHud(panel);ensureWorldIndicator(panel);'
          new_install = 'function install(panel){if(!panel?.shadowRoot)return;panel._ha3dScannerSync=()=>syncMode(panel);ensureHud(panel);ensureWorldIndicator(panel);'
          if old_install in h:
              h = h.replace(old_install, new_install, 1)
          elif 'panel._ha3dScannerSync=()=>syncMode(panel);' not in h:
              raise SystemExit('Could not expose Scanner sync hook')
          hud.write_text(h, encoding='utf-8')

          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js')
          e = entry.read_text(encoding='utf-8')
          e = e.replace('ha3d-xray-idle-v4.js?v=xray-idle-5', 'ha3d-xray-idle-v4.js?v=xray-idle-6')
          e = e.replace('ha3d-live-telemetry-hud.js?v=live-telemetry-1', 'ha3d-live-telemetry-hud.js?v=live-telemetry-2')
          entry.write_text(e, encoding='utf-8')

          manifest = Path('custom_components/ha3d/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          if data.get('version') != '0.2.28':
              raise SystemExit(f"Expected 0.2.28, got {data.get('version')}")
          data['version'] = '0.2.29'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha3d/frontend/ha3d-xray-idle-v4.js custom_components/ha3d/frontend/ha3d-live-telemetry-hud.js custom_components/ha3d/frontend/ha3d-entry.js custom_components/ha3d/manifest.json
          git commit -m "Restore Cinematic X-Ray Scanner activation chain"
          git push origin HEAD:main

      - name: Tag v0.2.29
        run: |
          git tag -a v0.2.29 -m "HA3D v0.2.29"
          git push origin v0.2.29

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.29 \
            --title "HA3D v0.2.29" \
            --notes "Restores the intended mode chain: Cinematic must be enabled for idle X-Ray to start; entering X-Ray now explicitly activates Scanner telemetry, and leaving X-Ray explicitly deactivates it. Scanner X-Ray detection is also redundant across controller state and visual class. Keeps active-vacuum attention from v0.2.27."
