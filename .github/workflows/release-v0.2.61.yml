name: Publish HA3D v0.2.61 robot cleaning pulse

on:
  push:
    paths:
      - .github/workflows/release-v0.2.61.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify robot cleaning pulse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.61'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.61"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-robot-cleaning-pulse.js?v=robot-cleaning-pulse-1' in entry
          pulse=Path('custom_components/ha3d/frontend/ha3d-robot-cleaning-pulse.js').read_text()
          for marker in ['CLEANING_STATE = "cleaning"', 'depthTest: false', 'RingGeometry', 'AdditiveBlending', '_robotObjects', 'requestAnimationFrame']:
              assert marker in pulse
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.61 -m "HA3D v0.2.61"
          git push origin v0.2.61
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.61 --title "HA3D v0.2.61" --notes "Adiciona um efeito visual exclusivo para robôs em estado cleaning: uma silhueta ciano translúcida visível através de paredes e móveis, dois anéis de radar pulsantes no piso e um beacon vertical muito sutil. O efeito segue a posição e orientação já calculadas pelo rastreador existente, sem alterar calibração ou Map Extractor, e desaparece imediatamente ao sair de cleaning. A v0.2.59 permanece como rollback estável e a v0.2.60 continua disponível para o hotfix das zonas de vista."
