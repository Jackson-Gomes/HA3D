name: Publish HA3D v0.2.31 Scanner focus highlight

on:
  push:
    paths:
      - .github/workflows/hotfix-v0.2.31.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Scanner focus highlight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from textwrap import dedent

          ai = Path('custom_components/ha3d/frontend/ha3d-ai-autonomous-exploration.js')
          a = ai.read_text(encoding='utf-8')

          state_old = '      cameraRaf: 0,\n      lastEvaluate: 0,'
          state_new = '      cameraRaf: 0,\n      focusPulseRaf: 0,\n      focusEmphasis: null,\n      lastEvaluate: 0,'
          if state_old not in a:
              raise SystemExit('Exploration state insertion point not found')
          a = a.replace(state_old, state_new, 1)

          marker = 'async function returnToOrbit(panel, savedPos, savedTarget, fast = false) {'
          if marker not in a:
              raise SystemExit('returnToOrbit marker not found')

          helpers = dedent(r'''
          function brightenFocusMaterial(material) {
            if (!material?.clone) return { assigned: material, disposable: [] };
            const clone = material.clone();
            try { clone.color?.set?.(0xa9f7ff); } catch (_error) {}
            if ('opacity' in clone) {
              clone.transparent = true;
              clone.opacity = Math.max(Number(clone.opacity) || 0, 0.52);
            }
            if ('depthWrite' in clone) clone.depthWrite = false;
            if ('toneMapped' in clone) clone.toneMapped = false;
            clone.needsUpdate = true;
            return { assigned: clone, disposable: [clone] };
          }

          function stopFocusEmphasis(panel) {
            const st = explorationState(panel);
            if (st.focusPulseRaf) cancelAnimationFrame(st.focusPulseRaf);
            st.focusPulseRaf = 0;
            const focus = st.focusEmphasis;
            if (!focus) return;

            for (const entry of focus.entries || []) {
              if (entry.object?.material === entry.assigned) entry.object.material = entry.original;
              for (const material of entry.disposable || []) material?.dispose?.();
            }

            if (focus.helper) {
              focus.helper.parent?.remove?.(focus.helper);
              focus.helper.geometry?.dispose?.();
              focus.helper.material?.dispose?.();
            }
            st.focusEmphasis = null;
          }

          function startFocusEmphasis(panel, candidate) {
            stopFocusEmphasis(panel);
            if (!candidate?.object || !panel?._scene || !isXrayActive(panel)) return;

            const st = explorationState(panel);
            const entries = [];
            candidate.object.traverse?.((object) => {
              if (!object?.isMesh || !object.material) return;
              const original = object.material;
              if (Array.isArray(original)) {
                const disposable = [];
                const assigned = original.map((material) => {
                  const result = brightenFocusMaterial(material);
                  disposable.push(...result.disposable);
                  return result.assigned;
                });
                object.material = assigned;
                entries.push({ object, original, assigned, disposable });
                return;
              }
              const result = brightenFocusMaterial(original);
              object.material = result.assigned;
              entries.push({ object, original, assigned: result.assigned, disposable: result.disposable });
            });

            let helper = null;
            try {
              helper = new THREE.Box3Helper(candidate.box.clone(), 0xb9fbff);
              helper.name = '__HA3D_SCANNER_FOCUS__';
              helper.renderOrder = 20;
              if (helper.material) {
                helper.material.transparent = true;
                helper.material.opacity = 0.88;
                helper.material.depthTest = false;
                helper.material.depthWrite = false;
                helper.material.toneMapped = false;
              }
              panel._scene.add(helper);
            } catch (_error) {}

            st.focusEmphasis = { entries, helper };
            const pulse = (now) => {
              if (!st.active || !isXrayActive(panel) || st.focusEmphasis?.helper !== helper) {
                st.focusPulseRaf = 0;
                return;
              }
              const wave = 0.5 + 0.5 * Math.sin(now * 0.0075);
              if (helper?.material) helper.material.opacity = 0.62 + wave * 0.34;
              for (const entry of entries) {
                const materials = Array.isArray(entry.assigned) ? entry.assigned : [entry.assigned];
                for (const material of materials) {
                  if (material && 'opacity' in material) material.opacity = 0.46 + wave * 0.18;
                }
              }
              st.focusPulseRaf = requestAnimationFrame(pulse);
            };
            st.focusPulseRaf = requestAnimationFrame(pulse);
          }

          ''')
          a = a.replace(marker, helpers + marker, 1)

          focus_old = '  panel._ha3dAiExplorationTarget = candidate.entity;\n  panel._ha3dScannerInspect?.(candidate.entity, "ACTIVE SCAN");\n\n  const savedPos = panel._camera.position.clone();'
          focus_new = '  panel._ha3dAiExplorationTarget = candidate.entity;\n  panel._ha3dScannerInspect?.(candidate.entity, "ACTIVE SCAN");\n  startFocusEmphasis(panel, candidate);\n\n  const savedPos = panel._camera.position.clone();'
          if focus_old not in a:
              raise SystemExit('Scanner focus start point not found')
          a = a.replace(focus_old, focus_new, 1)

          finally_old = '    await returnToOrbit(panel, savedPos, savedTarget, fast);\n\n    st.active = false;'
          finally_new = '    await returnToOrbit(panel, savedPos, savedTarget, fast);\n    stopFocusEmphasis(panel);\n\n    st.active = false;'
          if finally_old not in a:
              raise SystemExit('Scanner focus cleanup point not found')
          a = a.replace(finally_old, finally_new, 1)

          cleanup_old = 'function cleanup(panel) {\n  const st = explorationState(panel);'
          cleanup_new = 'function cleanup(panel) {\n  const st = explorationState(panel);\n  stopFocusEmphasis(panel);'
          if cleanup_old not in a:
              raise SystemExit('cleanup point not found')
          a = a.replace(cleanup_old, cleanup_new, 1)
          ai.write_text(a, encoding='utf-8')

          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js')
          e = entry.read_text(encoding='utf-8')
          old_token = 'ha3d-ai-autonomous-exploration.js?v=ai-autonomous-exploration-4'
          new_token = 'ha3d-ai-autonomous-exploration.js?v=ai-autonomous-exploration-5'
          if old_token not in e:
              raise SystemExit('AI cache token not found')
          entry.write_text(e.replace(old_token, new_token, 1), encoding='utf-8')

          manifest = Path('custom_components/ha3d/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          if data.get('version') != '0.2.30':
              raise SystemExit(f"Expected 0.2.30, got {data.get('version')}")
          data['version'] = '0.2.31'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate frontend syntax
        run: |
          node --check custom_components/ha3d/frontend/ha3d-ai-autonomous-exploration.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha3d/frontend/ha3d-ai-autonomous-exploration.js custom_components/ha3d/frontend/ha3d-entry.js custom_components/ha3d/manifest.json
          git commit -m "Highlight Scanner inspection target"
          git push origin HEAD:main

      - name: Tag v0.2.31
        run: |
          git tag -a v0.2.31 -m "HA3D v0.2.31"
          git push origin v0.2.31

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.31 --title "HA3D v0.2.31" --notes "Adds a visual Scanner focus highlight. During autonomous X-Ray inspection, the selected entity becomes brighter and more opaque than the surrounding X-Ray model, with a pulsing cyan bounding outline. The emphasis is temporary and safely restores the prior X-Ray material after the camera returns. Includes the v0.2.30 synchronized camera/telemetry Scanner loop and active-vacuum priority."
