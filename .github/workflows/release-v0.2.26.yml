name: Publish HA3D v0.2.26

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate manifest version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version = json.loads(Path('custom_components/ha3d/manifest.json').read_text())['version']
          if version != '0.2.26':
              raise SystemExit(f'Expected 0.2.26, got {version}')
          PY

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.26 -m "HA3D v0.2.26"
          git push origin v0.2.26

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.26 \
            --title "HA3D v0.2.26" \
            --notes "Fixes autonomous X-Ray exploration activation. X-Ray detection now accepts the controller state or visual class, preventing the exploration scheduler from remaining permanently disarmed. Also refreshes the frontend module cache token."
