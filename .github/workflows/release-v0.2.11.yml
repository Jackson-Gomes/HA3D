name: Publish HA3D v0.2.11

on:
  push:
    paths:
      - '.github/workflows/release-v0.2.11.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.11
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v0.2.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v0.2.11 --repo "$GITHUB_REPOSITORY" --target "da7596d00c473bd00e98d5282f67c11f7b3b2b59" --title "HA3D v0.2.11" --notes "Map-driven Xiaomi H50 positioning. Removes the legacy A/B/C calibration workflow from the UI, keeps icon or selected GLB geometry, and immediately places the chosen representation at the vacuum position derived from Xiaomi Map Extractor calibration points. The map can be shown or hidden independently while robot tracking continues."
