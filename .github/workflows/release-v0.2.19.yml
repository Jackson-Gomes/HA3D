name: Publish HA3D v0.2.19

on:
  push:
    paths:
      - '.github/workflows/release-v0.2.19.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.19
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v0.2.19 --repo "$GITHUB_REPOSITORY" --target "2e6750c090bd1be61873382d62fa7ab87d8887bf" --title "HA3D v0.2.19" --notes "Experimental live spatial telemetry HUD for classic X-Ray. Adds cyan-only layered telemetry using real Home Assistant entity states: 3D floor indicators and stems in world space, screen-space leader lines and callouts, typewriter telemetry text, real state-change event stream, passive bound-entity inspections, and real in-session numeric sparklines when enough samples exist. Does not recolor the apartment geometry. Rollback branch: pre-live-telemetry-hud-0.2.18."
