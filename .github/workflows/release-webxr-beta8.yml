name: Publish HA3D WebXR beta 0.2.65-beta.8

on:
  push:
    branches:
      - feature/webxr
    paths:
      - .github/workflows/release-webxr-beta8.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Quest AR beta.8 wiring
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version'] == '0.2.65-beta.8'
          init = Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.65-beta.8"' in init
          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-webxr-ar-v3.js?v=ar-v3-1' in entry
          assert 'ha3d-webxr-ar-v2.js?v=ar-v2-1' not in entry
          ar = Path('custom_components/ha3d/frontend/ha3d-webxr-ar-v3.js').read_text()
          for marker in [
              'immersive-ar',
              'plane-detection',
              'hand-tracking',
              'getFrame?.()',
              'session.enabledFeatures',
              'requestPersistentHandle',
              'restorePersistentAnchor',
              'deletePersistentAnchor',
              'initiateRoomCapture',
              'planeCenterWorld',
              'modelKey',
              '_ha3dAR3Starting',
              'restoreSessionState',
              'hapticActuators',
          ]:
              assert marker in ar, marker
          package = json.loads(Path('package.json').read_text())
          assert 'ha3d-webxr-ar-v3.js' in package['scripts']['check']
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.65-beta.8 -m "HA3D v0.2.65-beta.8 Quest AR hardening"
          git push origin v0.2.65-beta.8
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.65-beta.8 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "HA3D v0.2.65-beta.8 · Quest AR hardening" \
            --notes "Revisão de robustez da experiência Meta Quest em immersive-ar. Mantém passthrough e maquete, mas endurece ciclo de sessão, evita dupla abertura, restaura o renderer ao sair/falhar, usa enabledFeatures para só acionar planes/anchors quando realmente concedidos, calcula o centro real do polígono detectado para snap em mesa, escopa anchors persistentes pela revisão do GLB, mantém manipulação com uma ou duas mãos/controles e adiciona feedback háptico nos controles. O runtime v2 deixa de ser carregado. CI valida sintaxe do runtime v3, Python, JSON/HACS e regressões existentes. main e a v0.2.59 permanecem intactas." 
