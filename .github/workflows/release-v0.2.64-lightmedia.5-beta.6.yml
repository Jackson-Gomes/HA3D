name: Publish HA3D v0.2.64-lightmedia.5-beta.6

on:
  push:
    paths:
      - .github/workflows/release-v0.2.64-lightmedia.5-beta.6.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify MJPEG media source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          version='0.2.64-lightmedia.5-beta.6'
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']==version
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert f'FRONTEND_VERSION = "{version}"' in init
          assert 'HA3DMjpegFrameView(store, mjpeg_hub)' in init
          backend=Path('custom_components/ha3d/mjpeg_proxy.py').read_text()
          for marker in [
              'requires_auth = True',
              'address.is_private',
              'source_type") == "mjpeg"',
              'base64.b64encode(frame)',
              'b"\\xff\\xd8"',
              'b"\\xff\\xd9"',
          ]:
              assert marker in backend, marker
          panels=Path('custom_components/ha3d/media_panels.py').read_text()
          assert '"entity", "image", "video", "mjpeg"' in panels
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-mjpeg.js?v=mjpeg-1' in entry
          mjpeg=Path('custom_components/ha3d/frontend/ha3d-mjpeg.js').read_text()
          for marker in [
              'MJPEG ao vivo',
              'ha3d/mjpeg/frame/',
              'runtime._ha3dScreenPowered !== false',
              'runtime.group?.visible !== false',
              'source_type: "mjpeg"',
          ]:
              assert marker in mjpeg, marker
          power=Path('custom_components/ha3d/frontend/ha3d-media-panel-power.js').read_text()
          assert 'material.map = null' in power
          assert 'contains("ha3d-idle-xray")' in power
          PY
          node --check custom_components/ha3d/frontend/ha3d-mjpeg.js
          node --check custom_components/ha3d/frontend/ha3d-media-panel-power.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.64-lightmedia.5-beta.6 -m "HA3D v0.2.64-lightmedia.5-beta.6"
          git push origin v0.2.64-lightmedia.5-beta.6
      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.64-lightmedia.5-beta.6 \
            --prerelease \
            --title "HA3D v0.2.64-lightmedia.5-beta.6" \
            --notes "Adiciona fonte MJPEG ao vivo às Telas de mídia. O endereço local configurado é lido pelo Home Assistant através de um proxy autenticado e restrito a destinos privados/LAN; o frontend recebe o último JPEG e atualiza a textura da tela. Mantém TV desligada = tela preta, X-Ray = tela de mídia oculta e a correção de toque curto/long-press das lâmpadas. Teste sugerido: Fonte MJPEG ao vivo com http://192.168.0.216:8080. A estável v0.2.64-lightmedia.4 permanece preservada."
