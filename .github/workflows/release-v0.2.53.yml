name: Publish HA3D v0.2.53 marker proximity slider

on:
  push:
    paths:
      - .github/workflows/release-v0.2.53.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.53'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.53"' in init
          assert 'HA3DMarkerProximityView' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-marker-proximity-slider.js?v=marker-proximity-1' in entry
          slider=Path('custom_components/ha3d/frontend/ha3d-marker-proximity-slider.js').read_text()
          for marker in ['Distância para exibir o ícone', 'marker_proximity', 'DEFAULT_FACTOR = 1.15', 'ha3dProximityManaged']:
              assert marker in slider
          api=Path('custom_components/ha3d/marker_proximity.py').read_text()
          assert '/api/ha3d/marker_proximity' in api
          store=Path('custom_components/ha3d/storage.py').read_text()
          assert '"marker_proximity": {}' in store
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.53 -m "HA3D v0.2.53"
          git push origin v0.2.53
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.53 --title "HA3D v0.2.53" --notes "Adiciona o controle deslizante de proximidade dos ícones para bindings com Exibir somente quando próximo. Cada entidade passa a ter seu próprio limite persistido, de 25% a 300% da escala do modelo, mantendo 115% como padrão compatível com o comportamento anterior. Valores menores exigem maior aproximação; valores maiores fazem o ícone aparecer de mais longe. O filtro inferior de marcadores continua tendo prioridade. A v0.2.52 permanece disponível como rollback."
