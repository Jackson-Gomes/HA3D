name: Publish HA3D v0.2.42 virtual light markers

on:
  push:
    paths:
      - .github/workflows/release-v0.2.42.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.42'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.42"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-virtual-light-markers.js?v=virtual-light-markers-1' in entry
          marker=Path('custom_components/ha3d/frontend/ha3d-virtual-light-markers.js').read_text()
          for text in ['homeassistant", "toggle"', 'ha-state-icon', 'ha3dVirtualLightMarker', 'virtual_lights']:
              assert text in marker
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.42 -m "HA3D v0.2.42"
          git push origin v0.2.42
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.42 --title "HA3D v0.2.42" --notes "Adiciona um marcador clicável acima de cada luz virtual. Luzes vinculadas a light.* usam o ícone nativo do Home Assistant e alternam a entidade com um clique; luzes sem entidade alternam o estado virtual local. O marcador acompanha a posição 3D e reflete ligado, desligado e indisponível, sem alterar o motor de luzes da v0.2.41 nem a base estável da v0.2.40."
