name: Publish HA3D v0.2.24

on:
  push:
    paths:
      - '.github/workflows/release-v0.2.24.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.24
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.24 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v0.2.24 --repo "$GITHUB_REPOSITORY" --target "7b6d1c425c55cc5b965d8216466c5a833db8adb2" --title "HA3D v0.2.24" --notes "Fixes Editor Mode geometry movement. Restores the Three.js TransformControls helper so the translate/rotate/scale gizmo is actually attached to the scene, and adds direct drag in Move mode: clicking and dragging the selected GLB geometry now moves the object instead of orbiting/panning the apartment. Orbit controls are temporarily disabled only during the object drag and restored on release. Rollback branch: pre-editor-drag-hotfix-0.2.23."
