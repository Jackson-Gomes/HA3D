name: Patch HA3D v0.2.13 rotation

on:
  push:
    paths:
      - '.github/workflows/patch-v0.2.13.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix map rotation direction and bump version
        run: |
          python - <<'PY'
          from pathlib import Path

          overlay = Path('custom_components/ha3d/frontend/ha3d-robot-map-overlay.js')
          text = overlay.read_text()
          old = '  const r = THREE.MathUtils.degToRad(num(settings.rotation));'
          new = '  // PlaneGeometry is flipped onto XZ, so map-pixel rotation uses the opposite sign.\n  const r = THREE.MathUtils.degToRad(-num(settings.rotation));'
          if old not in text:
              raise SystemExit('rotation expression not found')
          overlay.write_text(text.replace(old, new, 1))

          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js')
          text = entry.read_text()
          old = 'import "./ha3d-robot-map-overlay.js?v=robot-map-overlay-2";'
          new = 'import "./ha3d-robot-map-overlay.js?v=robot-map-overlay-3";'
          if old not in text:
              raise SystemExit('overlay cache token not found')
          entry.write_text(text.replace(old, new, 1))

          manifest = Path('custom_components/ha3d/manifest.json')
          text = manifest.read_text()
          old = '"version": "0.2.12"'
          new = '"version": "0.2.13"'
          if old not in text:
              raise SystemExit('manifest version not found')
          manifest.write_text(text.replace(old, new, 1))

          init = Path('custom_components/ha3d/__init__.py')
          text = init.read_text()
          old = 'FRONTEND_VERSION = "0.2.12"'
          new = 'FRONTEND_VERSION = "0.2.13"'
          if old not in text:
              raise SystemExit('frontend version not found')
          init.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ha3d/frontend/ha3d-robot-map-overlay.js custom_components/ha3d/frontend/ha3d-entry.js custom_components/ha3d/manifest.json custom_components/ha3d/__init__.py
          git commit -m "Fix Xiaomi map rotation direction"
          git push origin HEAD:main
