name: Publish HA3D v0.2.48 object inspection

on:
  push:
    paths:
      - .github/workflows/release-v0.2.48.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify release contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.48'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.48"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-object-inspection.js?v=object-inspection-1' in entry
          inspection=Path('custom_components/ha3d/frontend/ha3d-object-inspection.js').read_text()
          for marker in ['Selecionado', 'Aproximado', '_ha3dInspectorAnchorKey', 'applyInspection', 'zoomTo', 'event?.detail']:
              assert marker in inspection
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.48 -m "HA3D v0.2.48"
          git push origin v0.2.48
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.48 --title "HA3D v0.2.48" --notes "Restaura a inspeção de objetos sem reintroduzir ações de entidade pela geometria. Um clique seleciona e destaca o objeto, aproxima suavemente a câmera, coloca o restante da cena em X-Ray e mostra widgets vinculados. O segundo clique de um double-click aproxima ainda mais o mesmo objeto. Clique longo continua entrando no Editor Mode travado, com X-Ray de edição no restante da cena. Entidades continuam abrindo somente pelos ícones do Home Assistant. A v0.2.47 permanece disponível como rollback."
