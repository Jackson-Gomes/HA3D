name: Publish HA3D v0.3.8

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.3.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v0.3.8 already exists"
            exit 0
          fi
          gh release create v0.3.8 \
            --repo "$GITHUB_REPOSITORY" \
            --target 844b9ffab2b46656563efe64c19ca39d793378fe \
            --title "HA3D v0.3.8" \
            --notes "Remove a camada de conversão SKP/OpenSKP e volta o upload para GLB puro. Corrige o upload de GLBs grandes e impede que a seleção de luzes no Editor seja roubada por objetos atrás da interface. O novo GLB continua substituindo o model.glb anterior."
