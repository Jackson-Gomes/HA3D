name: Publish HA3D v0.2.21

on:
  push:
    paths:
      - '.github/workflows/release-v0.2.21.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.2.21
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.21 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create v0.2.21 --repo "$GITHUB_REPOSITORY" --target "352325d81971ac3e5c5ebfc88bedfe7ce3962d76" --title "HA3D v0.2.21" --notes "Move both normal telemetry and red anomaly callouts away from the apartment center. Callouts now prefer upper/lower screen bands, keep side-aware leader lines, choose the side with available room, and vary gap/lateral placement between appearances. Keeps the v0.2.20 organic telemetry and real 3D event log unchanged. Rollback branch: pre-callout-edge-placement-0.2.20."
