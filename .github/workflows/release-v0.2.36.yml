name: Publish HA3D v0.2.36 logical object editor

on:
  push:
    paths:
      - .github/workflows/release-v0.2.36.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify v0.2.36 contents
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('custom_components/ha3d/manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version') != '0.2.36':
              raise SystemExit(f"Expected 0.2.36, got {manifest.get('version')}")

          entry = Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text(encoding='utf-8')
          if 'ha3d-editor-object-root.js?v=editor-object-root-1' not in entry:
              raise SystemExit('Logical-object editor module is not loaded by ha3d-entry.js')

          module = Path('custom_components/ha3d/frontend/ha3d-editor-object-root.js').read_text(encoding='utf-8')
          for marker in ['ha3dLogicalRootObject', '_applySavedObjectPositions', '_beginObjectDrag', 'Posição precisa do objeto completo']:
              if marker not in module:
                  raise SystemExit(f'Missing editor marker: {marker}')
          PY

      - name: Run project validation
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Tag v0.2.36
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.36 -m "HA3D v0.2.36"
          git push origin v0.2.36

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.36 --title "HA3D v0.2.36" --notes "Editor de posicionamento corrigido para tratar cada nó exportado do GLB como um objeto lógico completo. Clicar ou arrastar uma primitive agora seleciona e move o objeto inteiro, evitando desmontar geometrias com múltiplos materiais/primitives. O arraste livre mantém a altura no plano X/Z, a tríade continua disponível para mover/rotacionar/escalar, o editor mostra uma caixa de seleção do objeto completo e adiciona posicionamento numérico X/Y/Z e restauração da posição original do GLB. Transformações antigas salvas em primitives individuais são ignoradas para não reabrir objetos desmontados."
