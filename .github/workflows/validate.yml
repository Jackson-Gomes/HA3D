name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q custom_components/ha3d
      - name: Validate JSON and HACS layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [Path("hacs.json"), *Path("custom_components/ha3d").rglob("*.json")]:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"ok {path}")

          manifest = json.loads(Path("custom_components/ha3d/manifest.json").read_text(encoding="utf-8"))
          required = {"domain", "documentation", "issue_tracker", "codeowners", "name", "version"}
          missing = sorted(required - manifest.keys())
          if missing:
              raise SystemExit(f"manifest missing required HACS keys: {missing}")

          brand = Path("custom_components/ha3d/brand/icon.png")
          if not brand.is_file():
              raise SystemExit("missing custom_components/ha3d/brand/icon.png")
          print(f"ok {brand}")
          PY
      - name: Check frontend syntax
        run: npm run check
      - name: Robot calibration regressions
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Publish v0.3.4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.3.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.3.4 \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "HA3D v0.3.4" \
              --notes "Corrige a importação SKP no Home Assistant: respostas HTTP compatíveis com a API atual, limite de entrada SKP elevado para 1 GB e GLB final mantido em 250 MB."
          fi
