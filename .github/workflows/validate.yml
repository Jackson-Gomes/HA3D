name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python
        run: python -m compileall -q custom_components/ha3d
      - name: Validate JSON and HACS layout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in [Path("hacs.json"), *Path("custom_components/ha3d").rglob("*.json")]:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"ok {path}")

          manifest = json.loads(Path("custom_components/ha3d/manifest.json").read_text(encoding="utf-8"))
          required = {"domain", "documentation", "issue_tracker", "codeowners", "name", "version"}
          missing = sorted(required - manifest.keys())
          if missing:
              raise SystemExit(f"manifest missing required HACS keys: {missing}")

          brand = Path("custom_components/ha3d/brand/icon.png")
          if not brand.is_file():
              raise SystemExit("missing custom_components/ha3d/brand/icon.png")
          print(f"ok {brand}")
          PY
      - name: Check frontend syntax
        run: npm run check
      - name: Robot calibration regressions
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: syntax
    runs-on: ubuntu-latest
    steps:
      - name: Publish v0.3.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.6 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HA3D v0.3.6" \
            --notes "Corrige mais um layout real de textura em SKP legado. Quando o OpenSKP não encontra o par width/height após o CDib, o HA3D agora valida estruturalmente o restante completo do material e preserva a textura embutida, usando tamanho de fallback em vez de abortar com 'texture size block misaligned'. Inclui regressão com o byte pattern observado em apto3071.skp."
