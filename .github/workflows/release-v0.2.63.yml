name: Publish HA3D v0.2.63 robot clone hotfix

on:
  push:
    paths:
      - .github/workflows/release-v0.2.63.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify robot clone hotfix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.63'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.63"' in init
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'ha3d-robot-cleaning-pulse.js?v=robot-cleaning-pulse-3' in entry
          pulse=Path('custom_components/ha3d/frontend/ha3d-robot-cleaning-pulse.js').read_text()
          assert 'safeRenderableClone' in pulse
          assert 'source.clone(true)' not in pulse
          assert 'XRAY_COLOR = 0xff3b30' in pulse
          assert 'ha3d-idle-xray' in pulse
          assert 'robot cleaning effect skipped' in pulse
          PY
      - name: Run validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.63 -m "HA3D v0.2.63"
          git push origin v0.2.63
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.63 --title "HA3D v0.2.63" --notes "Hotfix para o carregamento do HA3D após a v0.2.62: remove o clone profundo da geometria do robô, que podia falhar ao serializar userData com referências circulares depois do GLB já estar carregado e fazer o cartão Escolher GLB reaparecer sobre a cena. O efeito agora copia apenas malhas e transforms, sem userData, e falhas visuais do robô não podem mais abortar o carregamento do dashboard. Também adiciona o destaque solicitado: quando o robô está cleaning e o X-Ray cinematográfico está ativo, a geometria fantasma, anéis e beacon mudam de ciano para vermelho e pulsam com mais intensidade; ao sair do X-Ray voltam ao ciano. Mantém continuidade de movimento da v0.2.62 e não altera calibração ou Map Extractor."
