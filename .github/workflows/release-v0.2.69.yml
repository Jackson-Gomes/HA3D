name: Publish HA3D v0.2.69 startup hotfix

on:
  push:
    paths:
      - .github/workflows/release-v0.2.69.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify startup hotfix
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          manifest=json.loads(Path('custom_components/ha3d/manifest.json').read_text())
          assert manifest['version']=='0.2.69'
          init=Path('custom_components/ha3d/__init__.py').read_text()
          assert 'FRONTEND_VERSION = "0.2.69"' in init
          gestures=Path('custom_components/ha3d/frontend/ha3d-interaction-gestures.js').read_text()
          assert 'function installLongPress(panel) {' in gestures
          assert 'Geometry never enters the editor from a press/hold gesture.' in gestures
          assert '\\n  return;\\n  const canvas' not in gestures
          entry=Path('custom_components/ha3d/frontend/ha3d-entry.js').read_text()
          assert 'interaction-gestures-4' in entry
          for required in ['ha3d-media-panels.js','ha3d-media-upload.js','ha3d-media-panel-power.js','ha3d-mjpeg.js']:
              assert required in entry
          PY
          node --check custom_components/ha3d/frontend/ha3d-interaction-gestures.js
          node --check custom_components/ha3d/frontend/ha3d-entry.js

      - name: Verify protected runtime unchanged
        run: |
          git fetch --tags --force
          for f in             custom_components/ha3d/frontend/ha3d-media-panels.js             custom_components/ha3d/frontend/ha3d-media-upload.js             custom_components/ha3d/frontend/ha3d-media-panel-power.js             custom_components/ha3d/frontend/ha3d-mjpeg.js             custom_components/ha3d/frontend/ha3d-robot-trackers.js             custom_components/ha3d/frontend/ha3d-robot-map-overlay.js             custom_components/ha3d/frontend/ha3d-robot-map-hotfix.js             custom_components/ha3d/frontend/ha3d-robot-map-shared-config.js             custom_components/ha3d/frontend/ha3d-robot-runtime-fix.js             custom_components/ha3d/frontend/ha3d-robot-motion-continuity.js             custom_components/ha3d/frontend/ha3d-robot-cleaning-pulse.js
          do
            git diff --quiet v0.2.68 -- "$f" || exit 1
          done

      - name: Run full validation
        run: |
          python -m compileall -q custom_components/ha3d
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.2.69 -m "HA3D v0.2.69"
          git push origin v0.2.69
          gh release create v0.2.69 --title "HA3D v0.2.69" --notes "Hotfix da v0.2.68: corrige ReferenceError canvas is not defined que prendia o HA3D em Iniciando. Nenhum módulo de LightMedia, MJPEG, robô ou mapa foi alterado. Mantém edição somente pelo botão Editor."
